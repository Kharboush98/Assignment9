<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/media.css">

</head>
<body>

    <section id="Navbar">
        <nav class="navbar navbar-expand-lg fixed-top p-0 border-bottom border-secondary-subtle">
            <div class="container py-3"> 
                <nav class="title me-4 d-flex justify-content-start align-items-center column-gap-2">
                    <div class="icon d-flex justify-content-center align-items-center">
                        <i class="fa-solid fa-address-book"></i>
                    </div>
                    <div class="d-flex justify-content-start flex-column column-gap-2">
                        <h4 class="m-0 fw-bold">Contact<span>Hub</span></h4>
                        <p class="m-0 fw-light">Smart Contact Manager</p>
                    </div>
                </nav>


                <div class="info-nav d-flex justify-content-center align-items-center column-gap-2">
                    <button>+ Add Contact</button>
                    <div class="iconbox d-flex justify-content-center align-items-center">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <div class="iconbox d-flex justify-content-center align-items-center">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <div class="userpic">
                        <img src="./images/avatar-2.jpg" alt="profilepic">
                    </div>
                </div>
            </div>
        </nav>
    </section>


    <section id="Main" class="container">
        <div class="statsContainer mb-5">
            <div class="stat">
                <div class="icon users">
                    <i class="fa-solid fa-users"></i>
                </div>

                <div class="details">
                    <p>Total</p>
                    <h5>6</h5>
                </div>
            </div>
            <div class="stat">
                <div class="icon fav">
                    <i class="fa-solid fa-star"></i>
                </div>

                <div class="details">
                    <p>Favorites</p>
                    <h5>3</h5>
                </div>
            </div>
            <div class="stat">
                <div class="icon emergency">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <div class="details">
                    <p>Emergency</p>
                    <h5>4</h5>
                </div>
            </div>            
        </div>


        <div class="contacts">
            <div class="allContact">
                <div class="header">
                    <h2>All Contacts</h2>
                    <p>Manage and organize your 6 contacts</p>
                </div>

                <div class="wrapper">
                    <div class="input-group">
                        <span class="input-group-text" id="basic-addon1">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Search by name, phone or email..." aria-label="Username" aria-describedby="basic-addon1">
                    </div>
                </div>

                <div class="contactCards">
                    <div class="card">
                        <div class="content">
                            <div class="header mb-3">
                                <div class="profile">
                                    <span>A</span>
                                </div>

                                <div class="mainInfo">
                                    <h3>Name</h3>
                                    <div class="iconTag">
                                        <div class="callTag">
                                            <i class="fa-solid fa-phone"></i>
                                        </div>
                                        <p>01007645673</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="otherInfo mb-3">
                                <div class="iconTag mb-2">
                                    <div class="msgTag">
                                        <i class="fa-solid fa-envelope"></i>
                                    </div>
                                    <p>jojo@gmail.com</p>
                                </div>

                                <div class="iconTag">
                                    <div class="locationTag">
                                        <i class="fa-solid fa-location-dot"></i>
                                    </div>
                                    <p>Alexandria</p>
                                </div>
                            </div>

                            <div class="infoTags d-flex justify-content-start align-items-center flex-wrap column-gap-2">
                                <div class="family-tag">
                                    Family
                                </div>

                                <div class="emergency-tag">
                                    <i class="fa-solid fa-heart-pulse"></i>
                                    Emergency
                                </div>
                            </div>

                        </div>



                        <div class="actions">

                        </div>
                    </div>

                    <div class="card">
                        <div class="content">

                        </div>
                        <div class="actions">

                        </div>
                    </div>
                    <div class="card">
                        <div class="content">

                        </div>
                        <div class="actions">

                        </div>
                    </div>
                </div>
            </div>

            <div class="widgets">

            </div>
        </div>

        

    </section>
    

    <script src="./Js/bootstrap.bundle.min.js"></script>
    <script src="./Js/main.js"></script>
</body>
</html>
