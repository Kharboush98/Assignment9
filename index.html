<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/media.css">

</head>
<body>
    <section id="Navbar">
        <nav class="navbar navbar-expand-lg fixed-top p-0 border-bottom border-secondary-subtle">
            <div class="container py-3"> 
                <nav class="title me-4 d-flex justify-content-start align-items-center column-gap-2">
                    <div class="icon d-flex justify-content-center align-items-center">
                        <i class="fa-solid fa-address-book"></i>
                    </div>
                    <div class="d-flex justify-content-start flex-column column-gap-2">
                        <h4 class="m-0 fw-bold">Contact<span>Hub</span></h4>
                        <p class="m-0 fw-light">Smart Contact Manager</p>
                    </div>
                </nav>


                <div class="info-nav d-flex justify-content-center align-items-center column-gap-2">
                    <button class="addbtn" data-bs-toggle="modal" data-bs-target="#addContactModal">+ Add Contact</button>
                    <div class="iconbox d-flex justify-content-center align-items-center">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <div class="iconbox d-flex justify-content-center align-items-center">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <div class="userpic">
                        <img src="./images/avatar-2.jpg" alt="profilepic">
                    </div>
                </div>
            </div>
        </nav>
    </section>

    <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Add new contact</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="addprofile d-flex justify-content-center align-items-center flex-column row-gap-2">
                        <div class="imgholder">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <button class="changeimg">
                            <i class="fa-solid fa-camera"></i>
                            Change Photo
                        </button>
                    </div>

                    <div class="name mb-4">
                        <label for="fullname" class="form-label">Full name <span>*</span></label>
                        <input type="text" class="form-control" id="fullname" placeholder="Enter Full name">
                    </div>

                    <div class="number mb-4">
                        <label for="number" class="form-label">Phone number <span>*</span></label>
                        <input type="text" class="form-control" id="number" placeholder="e.g., 01012345678">
                    </div>

                    <div class="email mb-4">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>

                    <div class="address mb-4">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" placeholder="Enter address">
                    </div>

                    <div class="group mb-4">
                        <label for="group" class="form-label">Primary Interest</label>
                        <select id="groupCat" class="form-control" aria-label="Default select example">
                            <option selected="Select a group">Select a group</option>
                            <option value="Family">Family</option>
                            <option value="Friends">Friends</option>
                            <option value="Work">Work</option>
                            <option value="School">School</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="notes mb-4">
                        <label for="contactInfo" class="form-label">Message</label>
                        <textarea class="form-control" id="contactInfo" rows="2" placeholder="Add notes about this contact"></textarea>
                    </div>

                    <div class="markcontact mb-4 d-flex justify-content-start align-items-center flex-row column-gap-4">
                        <div class="favMark">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="fav" id="favCheck">
                                <label class="form-check-label" for="favCheck">
                                    <i class="fa-solid fa-star"></i>
                                    Favorite
                                </label>
                            </div>
                        </div>
                        <div class="emMark">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="emergency" id="emCheck">
                                <label class="form-check-label" for="emCheck">
                                    <i class="fa-solid fa-heart-pulse"></i>
                                    Emergency
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="buttons-group d-flex justify-content-center align-items-center flex-row column-gap-2">
                        <button id="cancelContactBtn" class="cancelBtn">Cancel</button>
                        <button id="addContactBtn" class="saveBtn">Save Contact</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editContactModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Contact</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="addprofile d-flex justify-content-center align-items-center flex-column row-gap-2">
                        <div class="imgholder">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <button class="changeimg">
                            <i class="fa-solid fa-camera"></i>
                            Change Photo
                        </button>
                    </div>

                    <div class="name mb-4">
                        <label for="fullname" class="form-label">Full name <span>*</span></label>
                        <input type="text" class="form-control" id="editfullname" placeholder="Enter Full name">
                    </div>

                    <div class="number mb-4">
                        <label for="number" class="form-label">Phone number <span>*</span></label>
                        <input type="text" class="form-control" id="editnumber" placeholder="e.g., 01012345678">
                    </div>

                    <div class="email mb-4">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="editemail" placeholder="name@example.com">
                    </div>

                    <div class="address mb-4">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="editaddress" placeholder="Enter address">
                    </div>

                    <div class="group mb-4">
                        <label for="group" class="form-label">Primary Interest</label>
                        <select id="editgroupCat" class="form-control" aria-label="Default select example">
                            <option selected="Select a group">Select a group</option>
                            <option value="Family">Family</option>
                            <option value="Friends">Friends</option>
                            <option value="Work">Work</option>
                            <option value="School">School</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="notes mb-4">
                        <label for="contactInfo" class="form-label">Message</label>
                        <textarea class="form-control" id="editcontactInfo" rows="2" placeholder="Add notes about this contact"></textarea>
                    </div>

                    <div class="markcontact mb-4 d-flex justify-content-start align-items-center flex-row column-gap-4">
                        <div class="favMark">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="fav" id="editfavCheck">
                                <label class="form-check-label" for="favCheck">
                                    <i class="fa-solid fa-star"></i>
                                    Favorite
                                </label>
                            </div>
                        </div>
                        <div class="emMark">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="emergency" id="editemCheck">
                                <label class="form-check-label" for="emCheck">
                                    <i class="fa-solid fa-heart-pulse"></i>
                                    Emergency
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="buttons-group d-flex justify-content-center align-items-center flex-row column-gap-2">
                        <button id="editcancelContactBtn" class="editcancelBtn">Cancel</button>
                        <button id="editContactBtn" class="saveBtn">Edit Contact</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

        </div>

            <div class="contact-tabs">
                <div class="tab favoritesTab">
